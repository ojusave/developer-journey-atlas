name: Journey correction
description: Propose an evidence-backed correction to a published platform route.
title: "Journey correction: "
labels:
  - journey-correction
body:
  - type: input
    id: platform
    attributes:
      label: Platform and route URL
      placeholder: Render, https://developer-journey-atlas.onrender.com/platform/render
    validations:
      required: true
  - type: textarea
    id: disputed_step
    attributes:
      label: Disputed step
      description: Quote or identify the exact step, field, wait, branch, or outcome that should change.
    validations:
      required: true
  - type: input
    id: current_source
    attributes:
      label: Current first-party source
      description: Link to the source currently governing this claim, if known.
  - type: input
    id: proposed_source
    attributes:
      label: Proposed first-party source
      description: Link to the official documentation that supports the correction.
    validations:
      required: true
  - type: textarea
    id: expected_boundary
    attributes:
      label: Expected first-success boundary
      description: State the earliest meaningful result and its observable signal.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Contributor evidence
      description: Include the governing section, locator, observed route, and any assumptions.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgment
    attributes:
      label: Evidence check
      options:
        - label: I used first-party documentation and kept alternative routes separate.
          required: true
