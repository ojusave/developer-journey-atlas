<html lang="en">

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="brand" href="/" aria-label="Developer Journey Atlas home">
        <span class="brand-mark" aria-hidden="true">DJ</span>
        <span>Developer Journey Atlas</span>
      </a>
      <a href="https://github.com/ojusave/developer-journey-atlas">GitHub</a>
    </header>

    <main id="main">
      <section class="search-view" id="search-view" aria-labelledby="page-title">
        <div class="search-intro">
          <h1 id="page-title">Search a platform. See the first mile.</h1>
          <p>Find the steps, fields, gates, and official sources from account creation to first success.</p>
        </div>

        <form id="search-form" class="search-form" role="search" autocomplete="off">
          <label for="search">Platform</label>
          <div class="search-row">
            <input
              id="search"
              type="search"
              placeholder="OpenAI, Stripe, GitHub, Render..."
              aria-describedby="search-status"
              aria-controls="search-results"
              aria-autocomplete="list"
            />
            <button class="btn btn-primary" type="submit">Search</button>
          </div>
          <p id="search-status" class="status-line" role="status" aria-live="polite">Loading platforms...</p>
        </form>

        <ul id="search-results" class="search-results" aria-label="Matching platforms" hidden></ul>
        <div id="search-error" class="compact-state" role="alert" hidden>
          <p>Search is unavailable.</p>
          <button class="btn btn-secondary" id="search-retry" type="button">Try again</button>
        </div>
      </section>

      <section id="result" class="result-panel" aria-live="polite" hidden></section>
      <p id="global-status" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>

    <footer class="site-footer">
      <a href="/methodology.md">Method</a>
      <a href="/privacy.md">Privacy</a>
    </footer>

    <script src="/app.js?v=20260727-draft-routes" defer></script>
